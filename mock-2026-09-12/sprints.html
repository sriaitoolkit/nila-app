<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nila - Design Sprints</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; font-family: "Baloo 2", system-ui, sans-serif; background: #14110d; color: #f3ead9; }
  body { display: flex; }
  nav { width: 320px; min-width: 320px; background: #1d1812; border-right: 1px solid #3a2f22;
        display: flex; flex-direction: column; padding: 22px 0; }
  nav h1 { font-size: 21px; font-weight: 800; padding: 0 22px 4px; }
  nav .sub { font-size: 12px; color: #b8a888; padding: 0 22px 18px; border-bottom: 1px solid #3a2f22; }
  .sp { display: block; text-decoration: none; color: inherit; padding: 16px 22px; border-bottom: 1px solid #2a2218; cursor: pointer; }
  .sp:hover { background: #26201a; }
  .sp.on { background: #2c241a; border-left: 4px solid #f0b44c; padding-left: 18px; }
  .sp .n { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #f0b44c; }
  .sp .t { font-size: 16px; font-weight: 800; margin-top: 2px; }
  .sp .d { font-size: 12px; color: #b8a888; margin-top: 3px; line-height: 1.4; }
  .sp.soon { opacity: .55; cursor: default; }
  .sp.soon .n { color: #8f7f63; }
  .tabs { display: flex; gap: 6px; padding: 0 22px 14px; }
  .tab { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 800;
         background: #2a221a; color: #b8a888; cursor: pointer; border: 1px solid #3a2f22; }
  .tab.on { background: #f0b44c; color: #231a08; border-color: #f0b44c; }
  .cards { flex: 1; overflow-y: auto; padding: 26px clamp(18px,3vw,44px); display: flex; flex-direction: column; gap: 18px; align-content: flex-start; }
  .pod { background: #1d1812; border: 1px solid #3a2f22; border-radius: 14px; padding: 18px 22px; max-width: 900px; }
  .pod .ph { display: flex; align-items: baseline; gap: 12px; }
  .pod .pn { font-size: 17px; font-weight: 800; }
  .pod .pt { font-size: 11.5px; color: #8f7f63; font-weight: 700; }
  .pod ul { margin: 10px 0 0; padding-left: 18px; }
  .pod li { font-size: 13.5px; color: #d8ccb4; margin: 3px 0; line-height: 1.45; }
  .pod li b { color: #f0b44c; font-weight: 800; }
  .pod .blk { color: #e8907c; }
  main { flex: 1; min-width: 0; display: flex; }
  iframe { flex: 1; border: 0; background: #14110d; }
  .placeholder { flex: 1; display: grid; place-items: center; text-align: center; color: #b8a888; }
  .placeholder .big { font-size: 26px; font-weight: 800; color: #f3ead9; margin-bottom: 8px; }
</style>
</head>
<body>
<nav>
  <h1>Nila - Design Sprints</h1>
  <div class="sub">A new drop every 2-3 hours. Pick a sprint; its mocks load on the right. Everything is a concept render you can click.</div>
  <div class="tabs"><div class="tab on" id="tab-sprints">Sprints</div><div class="tab" id="tab-team">Team status</div></div>
  <div id="list"></div>
</nav>
<main id="main"></main>
<script>
const SPRINTS = [
  { n: "Sprint 1", t: "Home page redesign", d: "Five theme directions x the full kid + parent flow. Clay Room and Lantern Trail ship; the other three were killed at the kid-critic gate and stay for the record. Includes the new bookshelf beat.",
    url: "play.html" },
  { n: "Sprint 2", t: "Gamification around badges", d: "The awards wall: 7 skill ladders with named awards that grow HUGE (Word Sprout -> Story Spinner -> MASTER OF TALES), a just-earned medal, '2 more sessions to STORY SPINNER' nudges, and streak specials (WATER WARRIOR, BOOKWORM LEGEND). Opens at the awards wall; the whole flow is one click away.",
    url: "play.html?beat=6" },
  { n: "Sprint 3", t: "Bold themes 3 & 4", d: "Two genuinely BOLD new theme packs, generated wide and killed hard. In the pod right now - lands in this slot.",
    url: null },
];
const TEAM = [
  { pod: "Design pod", at: "12:52 IST", items: [
    ["Shipped", "Bookshelf beat + awards wall (Sprints 1-2) live on this page; click-through + standalone file refreshed."],
    ["Now", "Sprint 3: bold themes 3 & 4 - first sprint on the new playbook machine (BET -> BRIEF -> Generate-100 -> score -> crazy-critique -> kill log -> gates)."],
    ["Blockers", "none."] ] },
  { pod: "Quiz lane", at: "12:55 IST", items: [
    ["Shipped", "v3 critic program fully CLOSED - round-4 confirm 5/5 TAP both seats, T39 bounce evidence accepted, zero open items; engine + evidence committed and in Drive."],
    ["Now", "Idle, holding for the 00:35 IST wake owning the 7-image batch (t12-moon, t17-sticker, t26, t27, t29, t38, t44)."],
    ["Blockers", "none."] ] },
  { pod: "VC research run", at: "12:55 IST", items: [
    ["Shipped", "Constructive thesis round 2 in repair; neutral round 2 committed (reframed to experiment memo); advocate attack canonical (step 39)."],
    ["Now", "Waiting on constructive r2; then thesis-checker gets both originals + repair matrices + repaired drafts + lane pack + locked caveats."],
    ["Blockers", "Thesis-check gated on constructive r2. Bounded Facebook/TikTok coverage stays named, no risky logins."] ] },
  { pod: "Growth pod", at: "12:57 IST", items: [
    ["Activated", "Landing page, WhatsApp-first beta signup flow, Play Store listing, launch kit, onboarding + positioning as one draft-only launch pack; channel map, where-to-reply communities, where-to-pitch targets."],
    ["Now", "Grounding copy against the live apps, writing the first full pack for git."],
    ["Blockers", "None. Nothing publishes before the founder's GO_LIVE word."] ] },
  { pod: "Engineering pod", at: "12:55 IST", items: [
    ["Shipped", "Ecosystem run closed through thesis round-2 (neutral r2, advocate, video-social N1 repair, reddit-b reconciliation); quiz v3 round-4 + T39 debug; critic program closed; founder-direction record + plan SS6; design-product-sprints playbook committed."],
    ["Now", "Idle-watch for constructive thesis round 2 + thesis-check packet; quiz 00:35 image batch tonight; 06:00 daily issuance guard wake tomorrow."],
    ["Blockers", "none."] ] },
];
const list = document.getElementById("list"), main = document.getElementById("main");
let view = "sprints";
document.getElementById("tab-sprints").onclick = () => { view = "sprints"; syncTabs(); render(); };
document.getElementById("tab-team").onclick = () => { view = "team"; syncTabs(); render(); };
function syncTabs() {
  document.getElementById("tab-sprints").classList.toggle("on", view === "sprints");
  document.getElementById("tab-team").classList.toggle("on", view === "team");
  list.style.display = view === "sprints" ? "" : "none";
}
const q = new URLSearchParams(location.search);
let cur = Math.min(Math.max(parseInt(q.get("sprint") || "1", 10) || 1, 1), SPRINTS.length);
SPRINTS.forEach((s, i) => {
  const a = document.createElement("a");
  a.className = "sp" + (s.url ? "" : " soon") + (i + 1 === cur ? " on" : "");
  a.innerHTML = `<div class="n">${s.n}${s.url ? "" : " - in sprint now"}</div><div class="t">${s.t}</div><div class="d">${s.d}</div>`;
  if (s.url) a.onclick = () => { cur = i + 1; render(); history.replaceState(null, "", "?sprint=" + cur); };
  list.appendChild(a);
});
function render() {
  if (view === "team") {
    main.innerHTML = '<div class="cards">' + TEAM.map(p =>
      `<div class="pod"><div class="ph"><span class="pn">${p.pod}</span><span class="pt">standup ${p.at}</span></div><ul>` +
      p.items.map(([k, v]) => `<li><b${k === "Blockers" ? ' class="blk-label"' : ""}>${k}:</b> <span${k === "Blockers" && v !== "none." ? ' class="blk"' : ""}>${v}</span></li>`).join("") +
      "</ul></div>").join("") + "</div>";
    return;
  }
  const s = SPRINTS[cur - 1];
  [...list.children].forEach((el, i) => el.classList.toggle("on", i + 1 === cur));
  document.title = `Nila - ${s.n}: ${s.t}`;
  main.innerHTML = s.url
    ? `<iframe src="${s.url}" title="${s.t}"></iframe>`
    : `<div class="placeholder"><div><div class="big">${s.n}: ${s.t}</div><div>In the pod right now - this slot fills when the sprint ships.</div></div></div>`;
}
render();
</script>
</body>
</html>
