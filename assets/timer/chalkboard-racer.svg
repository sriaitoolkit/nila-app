<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 6)">
    <!-- rocket body, nose up-right -->
    <path d="M42 84 q-4 -26 12 -44 q10 -11 22 -14 q-1 14 -8 26 q-12 24 -34 36 z"
          stroke="#f4efe0" stroke-width="4" stroke-dasharray="7 5"/>
    <!-- window -->
    <circle cx="58" cy="50" r="7" stroke="#7ec8ff" stroke-width="3.5" stroke-dasharray="5 4"/>
    <circle cx="58" cy="50" r="2" fill="#7ec8ff" stroke="none"/>
    <!-- fins -->
    <path d="M40 70 q-12 2 -18 14 q10 2 20 -2" stroke="#f4efe0" stroke-width="3.5" stroke-dasharray="6 4"/>
    <path d="M52 84 q0 12 -8 18 q-4 -8 -2 -18" stroke="#f4efe0" stroke-width="3.5" stroke-dasharray="6 4"/>
    <!-- flame: dashed chalk jets -->
    <path d="M34 90 q-8 8 -10 16" stroke="#ffe066" stroke-width="4" stroke-dasharray="5 5"/>
    <path d="M42 94 q-4 8 -4 14" stroke="#ff9ecb" stroke-width="4" stroke-dasharray="5 5"/>
    <path d="M26 82 q-10 4 -16 12" stroke="#ffe066" stroke-width="3.5" stroke-dasharray="4 5"/>
    <!-- speed dashes -->
    <path d="M14 60 h14 M8 70 h10" stroke="#f4efe0" stroke-width="3" stroke-dasharray="4 5" opacity="0.8"/>
    <!-- chalk dust -->
    <circle cx="88" cy="34" r="1.6" fill="#f4efe0" stroke="none" opacity="0.7"/>
    <circle cx="96" cy="46" r="1.3" fill="#f4efe0" stroke="none" opacity="0.55"/>
    <circle cx="80" cy="24" r="1.3" fill="#f4efe0" stroke="none" opacity="0.55"/>
  </g>
</svg>
