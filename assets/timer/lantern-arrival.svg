<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe97a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffd24d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6df"/>
      <stop offset="100%" stop-color="#ecd9a0"/>
    </linearGradient>
    <radialGradient id="moonG" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffe97a"/>
      <stop offset="100%" stop-color="#e9b949"/>
    </radialGradient>
  </defs>
  <circle cx="58" cy="58" r="55" fill="url(#halo2)"/>
  <!-- crescent moon perch -->
  <path d="M74 96 a34 34 0 1 1 22 -58 a27 27 0 1 0 -22 58 z" fill="url(#moonG)" stroke="#c99b2f" stroke-width="1.6"/>
  <!-- moth at rest on the moon tip, wings folded up -->
  <path d="M58 46 q-13 -26 -2 -34 q10 6 8 32 z" fill="url(#wing2)" stroke="#c99b2f" stroke-width="1.6"/>
  <path d="M62 46 q13 -26 2 -34 q-10 6 -8 32 z" fill="url(#wing2)" stroke="#c99b2f" stroke-width="1.6"/>
  <path d="M54 22 a5 5 0 1 0 4 8 a4 4 0 1 1 -4 -8 z" fill="#ffd24d" opacity="0.9"/>
  <!-- body resting -->
  <ellipse cx="60" cy="52" rx="6.5" ry="13" fill="#ffd24d" stroke="#c99b2f" stroke-width="1.4"/>
  <path d="M56 48 q4 3 8 0 M56 54 q4 3 8 0" stroke="#c99b2f" stroke-width="1.2" fill="none"/>
  <!-- curled antennae -->
  <path d="M57 40 q-5 -6 -2 -10 q3 -2 4 1" stroke="#ffe97a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M63 40 q5 -6 2 -10 q-3 -2 -4 1" stroke="#ffe97a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M22 30 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8 z" fill="#ffe97a"/>
  <path d="M100 64 l1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3 z" fill="#ffe97a"/>
  <path d="M92 16 l1.1 2.7 2.7 1.1 -2.7 1.1 -1.1 2.7 -1.1 -2.7 -2.7 -1.1 2.7 -1.1 z" fill="#ffe97a"/>
</svg>
