  <path d="M44 33 q4 -5 8 0 M56 33 q4 -5 8 0" stroke="#3d2412" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M47 41 q7 6 14 0" stroke="#8a5a28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="41" cy="40" r="3.6" fill="#ff3d8b" opacity="0.35"/>
  <circle cx="67" cy="40" r="3.6" fill="#ff3d8b" opacity="0.35"/>
  <!-- finish flag -->
