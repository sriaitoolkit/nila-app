  <path d="M40 60 q14 10 28 0 M38 74 q16 10 32 0 M40 88 q14 8 28 0" stroke="#d9ab66" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- arms up -->
  <path d="M28 52 q-10 -10 -6 -22 q8 2 12 12 z" fill="url(#bellyG)"/>
  <path d="M80 52 q10 -10 6 -22 q-8 2 -12 12 z" fill="url(#bellyG)"/>
  <!-- feet -->
  <rect x="30" y="98" width="16" height="13" rx="6.5" fill="url(#bellyG)"/>
  <rect x="62" y="98" width="16" height="13" rx="6.5" fill="url(#bellyG)"/>
  <!-- head -->
  <circle cx="54" cy="34" r="17" fill="url(#bellyG)"/>
