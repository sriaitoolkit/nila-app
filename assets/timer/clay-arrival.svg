<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="shellG2" cx="42%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#c4f08a"/>
      <stop offset="50%" stop-color="#8cd94a"/>
      <stop offset="100%" stop-color="#4f9427"/>
    </radialGradient>
    <radialGradient id="bellyG" cx="45%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffe9bd"/>
      <stop offset="60%" stop-color="#f2cd90"/>
      <stop offset="100%" stop-color="#d9ab66"/>
    </radialGradient>
  </defs>
  <ellipse cx="55" cy="106" rx="38" ry="6" fill="#000000" opacity="0.22"/>
  <!-- shell back -->
  <circle cx="54" cy="66" r="37" fill="url(#shellG2)"/>
  <circle cx="54" cy="66" r="37" fill="none" stroke="#3f7d1e" stroke-width="2" opacity="0.5"/>
  <!-- belly -->
