  <g>
    <rect x="100" y="32" width="9" height="7" fill="#17123f"/>
    <rect x="109" y="32" width="9" height="7" fill="#fff4dc"/>
    <rect x="100" y="39" width="9" height="7" fill="#fff4dc"/>
    <rect x="109" y="39" width="9" height="7" fill="#17123f"/>
  </g>
  <!-- sparkles -->
  <path d="M16 22 l2.2 5.4 5.4 2.2 -5.4 2.2 -2.2 5.4 -2.2 -5.4 -5.4 -2.2 5.4 -2.2 z" fill="#ffc72c"/>
  <path d="M90 12 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#ffc72c"/>
