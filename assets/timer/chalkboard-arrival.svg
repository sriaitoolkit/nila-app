    <path d="M16 60 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2 z" stroke="#ff9ecb" stroke-width="2.6" stroke-dasharray="4 4"/>
